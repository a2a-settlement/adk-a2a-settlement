[tox]
envlist = py310,py311,py312
skip_missing_interpreters = true
isolated_build = true

[testenv]
description = Run CI-equivalent tests with coverage
skip_install = true
commands_pre =
    python -m pip install --upgrade pip
    python -m pip install -r requirements-ci.txt
    python -m pip install -e . --no-deps
    python -m pip install "google-adk[a2a]>=1.0.0" "httpx>=0.27" "cryptography>=43.0"
    python -m pip install -e ".[dev]" --no-deps
    python -m pip show pytest-cov
commands =
    python -m pytest --cov=adk_a2a_settlement --cov-report=xml --cov-report=term-missing -q
