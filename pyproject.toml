[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adk-a2a-settlement"
version = "0.1.0"
description = "A2A Settlement Extension integration for Google Agent Development Kit (ADK)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["a2a", "settlement", "adk", "google-adk", "ai-agents", "escrow"]
dependencies = [
    "google-adk[a2a]>=1.0.0",
    "a2a-settlement>=0.6.0",
    "httpx>=0.27",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "coverage>=7.0",
]

[project.urls]
Homepage = "https://github.com/a2a-settlement/adk-a2a-settlement"
Exchange = "https://exchange.a2a-settlement.org"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["adk_a2a_settlement*"]
