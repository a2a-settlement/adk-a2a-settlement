name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install -e . --no-deps
          python -m pip install "google-adk[a2a]>=1.0.0" "httpx>=0.27" "cryptography>=43.0"
          python -m pip install -e ".[dev]" --no-deps
      - name: Verify coverage plugin
        run: python -m pip show pytest-cov
      - name: Run tests
        run: python -m pytest --cov=adk_a2a_settlement --cov-report=xml --cov-report=term-missing -q
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
