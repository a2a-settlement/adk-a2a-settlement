name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      A2A_SETTLEMENT_GIT_REF: v0.6.0
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install "google-adk[a2a]>=1.0.0" "a2a-settlement @ git+https://github.com/a2a-settlement/a2a-settlement.git@${A2A_SETTLEMENT_GIT_REF}" "httpx>=0.27" "cryptography>=43.0"
          pip install -e ".[dev]" --no-deps
          pip install pytest-cov
      - name: Run tests
        run: pytest --cov=adk_a2a_settlement --cov-report=xml --cov-report=term-missing -q
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
